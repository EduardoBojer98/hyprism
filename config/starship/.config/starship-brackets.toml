# Monolith's prompt (theme.json term.prompt "brackets"): a terminal HUD, bracketed fields, no powerline glyphs.
# ThemeSync writes ~/.config/hyprism/starship.toml from this file while Monolith is the theme, palette swapped in.
palette = "hyprism"
add_newline = true
format = '''
[┌─](faint)$directory$git_branch$git_status
[└─](faint)$character'''
right_format = "$nodejs$php$python$cmd_duration$status$jobs$time"

[character]
success_symbol = "[>](bold accent)"
error_symbol = "[>](bold err)"

[directory]
style = "bold accent"
format = '[\[]($style)[$path]($style)[\]]($style)'
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "accent2"
format = '[ \[git:$branch\]]($style)'

[git_status]
style = "warn"
format = '([ \[$all_status$ahead_behind\]]($style))'

[cmd_duration]
min_time = 2000
style = "faint"
format = '[\[took $duration\]]($style) '

[status]
disabled = false
style = "err"
format = '[\[exit $status\]]($style) '

[nodejs]
symbol = " "
style = "ok"
format = "[$symbol$version]($style) "

[php]
symbol = " "
style = "accent2"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "warn"
format = "[$symbol$version]($style) "

[jobs]
symbol = "󰜎"
style = "warn"
format = "[$symbol $number]($style) "

[time]
disabled = false
style = "faint"
format = '[\[$time\]]($style)'
time_format = "%H:%M"

[palettes.hyprism]
accent = "#e4ff1a"
on_accent = "#0c0d08"
accent2 = "#ff6b0a"
raised = "#1f2216"
ok = "#3ddc97"
warn = "#ffb547"
err = "#ff4f6d"
faint = "#8a8e6a"
