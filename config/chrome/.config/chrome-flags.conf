# Read by /usr/bin/google-chrome-stable at every start (one flag per line).
# Decode video on the AMD GPU (VA-API) instead of the CPU: Chrome on Linux leaves it off by default,
# and a YouTube tab kept the laptop at ~73 C / 25 W (docs/thermal-audit.md).
# Check in chrome://gpu > Video Acceleration Information. Undo: delete this file, restart Chrome.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL
