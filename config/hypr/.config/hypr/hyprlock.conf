# Lock screen. The design (lockscreens/<name>.conf) comes from the active rice; the background is your
# choice in Settings > Lock Screen: the desktop wallpaper or another image, with blur and brightness.
# Quickshell ThemeSync writes settings/hyprlock-theme.conf, which sets the variables below from the
# rice and sources its design. These defaults are Pebble's, for before the shell has run once.
$accent   = rgb(ff9e7a)
$accent2  = rgb(9ad1c0)
$text     = rgb(ece8f6)
$muted    = rgb(b9b3cc)
$ground   = rgb(16141f)
$surface  = rgb(221f2e)
$fail     = rgb(ff6b8a)
$rounding = 18
$wall     = ~/.config/hypr/settings/wallpaper
$blur     = 3
$dim      = 0.72
$clock    = %H:%M
$hour     = %H
$font     = Outfit
$display  = Outfit
$mono     = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# your settings first: the background below uses their $wall, $blur and $dim
source = ~/.config/hypr/settings/hyprlock-theme.conf

background {
    monitor     =
    path        = $wall
    color       = rgba(1c1c1eff)
    blur_passes = $blur
    blur_size   = 8
    brightness  = $dim
    vibrancy    = 0.2
}
