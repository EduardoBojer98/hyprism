# Lock screen. Quickshell (LockScreen.qml, ThemeSync.qml) writes settings/hyprlock-theme.conf: the
# active theme's colours and fonts, your background from Settings > Lock Screen (picture, blur,
# brightness) and the whole layout (clock, date, picture, password field, widgets). A fresh install
# starts from defaults/hyprlock-theme.conf (Pebble). These variables are the fallbacks.
$accent   = rgb(ff9e7a)
$accent2  = rgb(9ad1c0)
$text     = rgb(ece8f6)
$muted    = rgb(b9b3cc)
$ground   = rgb(16141f)
$surface  = rgb(221f2e)
$fail     = rgb(ff6b8a)
$rounding = 18
$wall     = ~/.config/hypr/settings/wallpaper
$blur     = 3
$dim      = 0.72
$font     = Outfit
$display  = Outfit
$mono     = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# your settings first: the background below uses their $wall, $blur and $dim
source = ~/.config/hypr/settings/hyprlock-theme.conf

background {
    monitor     =
    path        = $wall
    color       = rgba(1c1c1eff)
    blur_passes = $blur
    blur_size   = 8
    brightness  = $dim
    vibrancy    = 0.2
}
