# Lock screen. The layout is one of the designs in lockscreens/ (picked in Settings > Appearance >
# Lock Screen); the background is your own choice there too: the desktop wallpaper or another
# image, with blur and brightness. Quickshell ThemeSync writes settings/hyprlock-theme.conf, which
# sets the variables below and sources the chosen design.
$accent   = rgb(0a84ff)
$accent2  = rgb(00e5ff)
$rounding = 12
$wall     = ~/.config/hypr/settings/wallpaper
$blur     = 3
$dim      = 0.72
$clock    = %H:%M
$hour     = %H
$font     = Inter

general {
    hide_cursor = true
}

# your settings first: the background below uses their $wall, $blur and $dim
source = ~/.config/hypr/settings/hyprlock-theme.conf

background {
    monitor     =
    path        = $wall
    color       = rgba(1c1c1eff)
    blur_passes = $blur
    blur_size   = 8
    brightness  = $dim
    vibrancy    = 0.2
}
