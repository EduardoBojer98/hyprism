# Written by the Settings app (Lock & Sleep). hypridle still uses hyprlang.
general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session; hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 30 s later: screens off
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 20 min: idle-sleep sleeps if 20 min is the time for the power source in use (battery 20, mains never), then
# hibernate after 60 more min where hibernation is set up
listener {
    timeout    = 1200
    on-timeout = idle-sleep 20 0 20
}
