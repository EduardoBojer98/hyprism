# Written by the Settings app (Lock & Sleep). hypridle still uses hyprlang.
general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = hypr-crashlog mark sleep; loginctl lock-session; screens on
    after_sleep_cmd  = hypr-crashlog mark wake; screens on
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 30 s later: screens off
listener {
    timeout    = 330
    on-timeout = brightnessctl -q -s; screens off
    on-resume  = screens on
}

# 20 min: idle-sleep sleeps if 20 min is the time for the power source in use (battery 20, mains never), then
# hibernate after 60 more min where hibernation is set up
listener {
    timeout    = 1200
    on-timeout = idle-sleep 20 0 20
}
