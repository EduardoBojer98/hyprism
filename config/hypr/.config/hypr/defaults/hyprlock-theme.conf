# Default for a fresh install (Pebble, written by Quickshell's ThemeSync). Settings > Lock Screen rewrites
# ~/.config/hypr/settings/hyprlock-theme.conf; this copy is only used until the shell has run once.
$accent = rgb(ff9e7a)
$accent2 = rgb(9ad1c0)
$text = rgb(ece8f6)
$muted = rgb(b9b3cc)
$ground = rgb(16141f)
$surface = rgb(221f2e)
$fail = rgb(ff6b8a)
$rounding = 18
$wall = ~/.config/hypr/settings/wallpaper
$blur = 2
$dim = 0.76
$font = Outfit
$display = Outfit
$mono = JetBrainsMono Nerd Font

# The layout: LockScreen.qml (Pebble, clock big, center)
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    font_size   = 112
    font_family = Outfit Medium
    color       = rgb(f5f5f7)
    position    = 0, 52
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_size   = 17
    font_family = Outfit Medium
    color       = rgba(245, 245, 247, 0.78)
    position    = 0, -50
    halign      = center
    valign      = center
}
input-field {
    monitor           =
    size              = 300, 50
    outline_thickness = 1
    rounding          = -1
    outer_color       = rgb(ff9e7a)
    inner_color       = rgba(34, 31, 46, 0.85)
    font_color        = rgb(ece8f6)
    font_family       = Outfit
    check_color       = rgb(9ad1c0)
    fail_color        = rgb(ff6b8a)
    placeholder_text  = <span foreground="##b9b3cc">Password  ·  $LAYOUT</span>
    fail_text         = <i>$FAIL</i>
    fade_on_empty     = false
    dots_center       = true
    position    = 0, -114
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:5000] sh -c 'b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$b" ] && printf '\''bat %s%%'\'' "$b"'
    font_size   = 12
    font_family = Outfit Medium
    color       = rgba(245, 245, 247, 0.78)
    position    = 0, 36
    halign      = center
    valign      = bottom
}

