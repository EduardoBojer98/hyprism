# Terminal: a monospaced prompt in a dark box, as if the screen were a shell waiting for a password
shape {
    monitor     =
    size        = 560, 260
    color       = rgba(0a0a0cd9)
    rounding    = 8
    border_size = 1
    border_color = $accent
    position    = 0, 0
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:1000] echo "$USER@$(cat /etc/hostname) ~ locked at $(date +"$clock")"
    font_size   = 14
    font_family = JetBrainsMono Nerd Font
    color       = $accent
    position    = -40, 80
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:60000] date +"## %A %-d %B %Y"
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    color       = rgba(f5f5f78c)
    position    = -40, 45
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = $ sudo unlock
    font_size   = 14
    font_family = JetBrainsMono Nerd Font
    color       = rgba(f5f5f7e6)
    position    = -170, -5
    halign      = center
    valign      = center
}
input-field {
    monitor           =
    size              = 460, 38
    outline_thickness = 0
    rounding          = 4
    inner_color       = rgba(ffffff0f)
    font_color        = rgb(f5f5f7)
    font_family       = JetBrainsMono Nerd Font
    check_color       = $accent
    fail_color        = rgb(ff453a)
    placeholder_text  = <span foreground="##f5f5f766">[sudo] password for $USER:</span>
    fail_text         = <span foreground="##ff453a">Sorry, try again.</span>
    fade_on_empty     = false
    dots_center       = false
    position          = 0, -60
    halign            = center
    valign            = center
}
