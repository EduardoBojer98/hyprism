# Noir: a title card. Black bands top and bottom, the time as a serif title, the password as a credit.
shape {
    rounding    = 0
    border_size = 0
    monitor = 
    size    = 100%, 11%
    color   = rgb(000000)
    position = 0, 0
    halign  = center
    valign  = top
}
shape {
    rounding    = 0
    border_size = 0
    monitor = 
    size    = 100%, 11%
    color   = rgb(000000)
    position = 0, 0
    halign  = center
    valign  = bottom
}
label {
    monitor     =
    text        = cmd[update:1000] date +"$clock"
    font_size   = 110
    font_family = $display Light
    color       = $text
    position    = 0, 70
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, the %-d of %B"
    font_size   = 20
    font_family = $display Light Italic
    color       = $accent
    position    = 0, -30
    halign      = center
    valign      = center
}
input-field {
    monitor           =
    size              = 320, 40
    outline_thickness = 1
    rounding          = 0
    outer_color       = $muted
    inner_color       = rgba(0, 0, 0, 0.6)
    font_color        = $text
    font_family       = $font
    check_color       = $accent
    fail_color        = $fail
    placeholder_text  = <i><span foreground="##b8b0a2">a password, please</span></i>
    fail_text         = <i>not this one</i>
    fade_on_empty     = false
    dots_center       = true
    position          = 0, 70
    halign            = center
    valign            = bottom
}
