# Minimal: a small clock and date in the bottom-left corner, the password field under them,
# nearly all of the picture left free
label {
    monitor     =
    text        = cmd[update:1000] date +"$clock"
    font_size   = 64
    font_family = Inter Display Light
    color       = rgba(ffffffee)
    position    = 64, 190
    halign      = left
    valign      = bottom
}
label {
    monitor     =
    text        = cmd[update:60000] date +"%A %-d %B"
    font_size   = 15
    font_family = $font
    color       = rgba(ffffffbb)
    position    = 68, 160
    halign      = left
    valign      = bottom
}
input-field {
    monitor           =
    size              = 220, 34
    outline_thickness = 0
    rounding          = -1
    inner_color       = rgba(ffffff22)
    font_color        = rgb(ffffff)
    font_family       = $font
    check_color       = $accent
    fail_color        = rgb(ff453a)
    placeholder_text  = <span foreground="##ffffff88">Password</span>
    fail_text         = <span foreground="##ff453a">Try again</span>
    fade_on_empty     = true
    fade_timeout      = 3000
    dots_center       = false
    position          = 64, 90
    halign            = left
    valign            = bottom
}
