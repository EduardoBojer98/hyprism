# Console: an amber readout. Time with seconds top-left, a status line, the password as a prompt.
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M:%S"
    font_size   = 72
    font_family = $mono Light
    color       = $accent
    position    = 80, -80
    halign      = left
    valign      = top
}
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +'%a %d %b %Y' | tr a-z A-Z)  ·  LOCKED  ·  $USER@$(cat /etc/hostname)"
    font_size   = 13
    font_family = $mono
    color       = $muted
    position    = 84, -190
    halign      = left
    valign      = top
}
input-field {
    monitor           =
    size              = 520, 44
    outline_thickness = 1
    rounding          = 0
    outer_color       = $accent
    inner_color       = rgba(5, 8, 15, 0.9)
    font_color        = $accent
    font_family       = $mono
    check_color       = $accent2
    fail_color        = $fail
    placeholder_text  = <span foreground="##c19b52">AUTH ❯ PASSWORD</span>
    fail_text         = ACCESS DENIED
    fade_on_empty     = false
    dots_center       = false
    position          = 80, -240
    halign            = left
    valign            = top
}
