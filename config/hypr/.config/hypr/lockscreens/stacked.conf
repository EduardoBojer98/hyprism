# Stacked: the hour above the minutes in very large bold digits, the minutes in your accent colour
label {
    monitor       =
    text          = cmd[update:1000] date +"$hour"
    font_size     = 190
    font_family   = Inter Display Black
    color         = rgba(f5f5f7f2)
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(00000050)
    position      = 0, 210
    halign        = center
    valign        = center
}
label {
    monitor       =
    text          = cmd[update:1000] date +"%M"
    font_size     = 190
    font_family   = Inter Display Black
    color         = $accent
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(00000050)
    position      = 0, -10
    halign        = center
    valign        = center
}
label {
    monitor     =
    text        = cmd[update:60000] date +"%A · %-d %B" | tr '[:lower:]' '[:upper:]'
    font_size   = 15
    font_family = $font SemiBold
    color       = rgba(f5f5f7cc)
    position    = 0, -160
    halign      = center
    valign      = center
}
input-field {
    monitor           =
    size              = 260, 42
    outline_thickness = 1
    rounding          = -1
    outer_color       = rgba(ffffff26)
    inner_color       = rgba(00000040)
    font_color        = rgb(f5f5f7)
    font_family       = $font
    check_color       = $accent
    fail_color        = rgb(ff453a)
    placeholder_text  = <span foreground="##f5f5f799">Enter Password</span>
    fail_text         = <span foreground="##ff453a">Wrong password</span>
    fade_on_empty     = false
    dots_center       = true
    position          = 0, 90
    halign            = center
    valign            = bottom
}
