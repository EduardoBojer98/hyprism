# Sidebar: a frosted panel down the left side holding the clock, a greeting and the password
# field; the picture stays clear on the right
shape {
    monitor      =
    size         = 33%, 100%
    color        = rgba(0c0c10a6)
    rounding     = 0
    border_size  = 0
    position     = 0, 0
    halign       = left
    valign       = center
}
shape {
    monitor  =
    size     = 4, 120
    color    = $accent
    rounding = 2
    position = 70, 140
    halign   = left
    valign   = center
}
label {
    monitor     =
    text        = cmd[update:1000] date +"$clock"
    font_size   = 88
    font_family = Inter Display Bold
    color       = rgba(f5f5f7ff)
    position    = 96, 160
    halign      = left
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_size   = 18
    font_family = $font Medium
    color       = rgba(f5f5f7bb)
    position    = 100, 70
    halign      = left
    valign      = center
}
label {
    monitor     =
    text        = Welcome back, $DESC
    font_size   = 16
    font_family = $font SemiBold
    color       = rgba(f5f5f7e6)
    position    = 100, -60
    halign      = left
    valign      = center
}
input-field {
    monitor           =
    size              = 320, 44
    outline_thickness = 1
    rounding          = $rounding
    outer_color       = rgba(ffffff26)
    inner_color       = rgba(ffffff14)
    font_color        = rgb(f5f5f7)
    font_family       = $font
    check_color       = $accent
    fail_color        = rgb(ff453a)
    placeholder_text  = <span foreground="##f5f5f799">Enter Password</span>
    fail_text         = <span foreground="##ff453a">Wrong password</span>
    fade_on_empty     = false
    dots_center       = false
    position          = 100, -120
    halign            = left
    valign            = center
}
