# Pebble: a big soft clock, the date under it, and a round password pill, all centred
label {
    monitor     =
    text        = cmd[update:1000] date +"$clock"
    font_size   = 120
    font_family = $display Light
    color       = $text
    position    = 0, 90
    halign      = center
    valign      = center
}
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_size   = 18
    font_family = $font
    color       = $muted
    position    = 0, -10
    halign      = center
    valign      = center
}
input-field {
    monitor           =
    size              = 300, 52
    outline_thickness = 2
    rounding          = -1
    outer_color       = $accent
    inner_color       = rgba(22, 20, 31, 0.85)
    font_color        = $text
    font_family       = $font
    check_color       = $accent2
    fail_color        = $fail
    placeholder_text  = <span foreground="##b9b3cc">Password</span>
    fail_text         = <i>Try again</i>
    fade_on_empty     = false
    dots_center       = true
    position          = 0, -100
    halign            = center
    valign            = center
}
