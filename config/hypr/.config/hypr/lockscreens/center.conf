# Centre: everything in the middle of the screen: date, a large thin clock, then the password field
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_size   = 18
    font_family = $font Medium
    color       = rgba(f5f5f7cc)
    position    = 0, 150
    halign      = center
    valign      = center
}
label {
    monitor       =
    text          = cmd[update:1000] date +"$clock"
    font_size     = 140
    font_family = $display Light
    color         = rgba(f5f5f7f2)
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(00000050)
    position      = 0, 40
    halign        = center
    valign        = center
}
input-field {
    monitor           =
    size              = 300, 46
    outline_thickness = 2
    rounding          = $rounding
    outer_color       = $accent
    inner_color       = rgba(0000004d)
    font_color        = rgb(f5f5f7)
    font_family       = $font
    check_color       = $accent
    fail_color        = rgb(ff453a)
    placeholder_text  = <span foreground="##f5f5f799">Password for $USER</span>
    fail_text         = <span foreground="##ff453a">Wrong password</span>
    fade_on_empty     = false
    dots_center       = true
    position          = 0, -110
    halign            = center
    valign            = center
}
