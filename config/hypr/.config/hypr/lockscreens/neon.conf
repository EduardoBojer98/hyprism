# Neon: a glowing clock in the accent, the date in the second accent, a password field with the
# theme's gradient outline, over a darker picture. Colours come from Settings > Appearance
# ($accent, $accent2 in settings/hyprlock-theme.conf).
label {
    monitor     =
    text        = cmd[update:60000] date +"%A  %-d %B" | tr '[:lower:]' '[:upper:]'
    font_size   = 15
    font_family = $font Bold
    color       = $accent2
    position    = 0, 170
    halign      = center
    valign      = center
}
label {
    monitor       =
    text          = cmd[update:1000] date +"$clock"
    font_size     = 132
    font_family   = $font Bold
    color         = $accent
    shadow_passes = 3
    shadow_size   = 12
    shadow_color  = $accent
    shadow_boost  = 0.6
    position      = 0, 50
    halign        = center
    valign        = center
}
input-field {
    monitor           =
    size              = 320, 48
    outline_thickness = 2
    rounding          = -1
    outer_color       = $accent $accent2 45deg
    inner_color       = rgba(0a0a0ce6)
    font_color        = rgb(f5f5f7)
    font_family       = $font
    check_color       = $accent2 $accent 45deg
    fail_color        = rgb(ff4d6d)
    placeholder_text  = <span foreground="##f5f5f799">Password for $USER</span>
    fail_text         = <span foreground="##ff4d6d">Wrong password</span>
    fade_on_empty     = false
    dots_center       = true
    position          = 0, -110
    halign            = center
    valign            = center
}
