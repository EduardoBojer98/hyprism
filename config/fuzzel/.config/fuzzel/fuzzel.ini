# Emoji picker window (emojipick). Colours follow Settings > Appearance: ThemeSync writes
# ~/.config/fuzzel/theme.ini (install.sh starts it from theme-default.ini).
[main]
font=Inter:size=12
terminal=ghostty +new-window -e
icon-theme=Papirus-Dark
width=40
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
include=~/.config/fuzzel/theme.ini

[border]
width=2
radius=12
