# Checks every push and pull request: shellcheck on all scripts; QML, Lua, colour and theme checks
# (tests/lint.sh); then a fresh install (twice, idempotent, then doctor) in Arch and Fedora containers.
# AUR packages and host steps can't run here.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read   # the checks only read the repo

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          files=$(for f in install.sh distros/*.sh hosts/*/steps/*.sh tests/*.sh .githooks/pre-commit config/scripts/.local/bin/*; do
            head -1 "$f" | grep -qE 'bash|sh' && echo "$f"; done)
          docker run --rm -v "$PWD":/mnt:ro -w /mnt koalaman/shellcheck:stable -S warning $files

  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git qt6-declarative lua python shellcheck >/dev/null
      - uses: actions/checkout@v5
      - name: QML, Lua, colours, themes
        run: bash tests/lint.sh

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:latest, fedora:latest]
    steps:
      - uses: actions/checkout@v5
      - name: install twice, then doctor (${{ matrix.image }})
        run: docker run --rm -v "$PWD":/mnt/repo:ro ${{ matrix.image }} bash /mnt/repo/tests/container-test.sh
