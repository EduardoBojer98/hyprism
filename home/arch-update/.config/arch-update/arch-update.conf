# Arch-Update / cachy-update (CachyOS's update notifier). Only the options changed from the
# defaults are here; `arch-update --show-config` lists them all.

# The tray icon only appears when there are updates (or news) to install.
# Settings > Startup Apps starts "Arch-Update Systray Applet"; arch-update.timer checks in the background.
ShowTrayWhenRelevant
