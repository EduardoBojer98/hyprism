# Lock screen, in the shell's Graphite Glass style: dimmed blurred wallpaper, date over a large
# clock near the top, your name and a glass password pill near the bottom.
# $accent and $rounding come from Settings > Appearance (Quickshell ThemeSync).
$accent = rgb(0a84ff)
$rounding = 12
source = ~/.config/hypr/settings/hyprlock-theme.conf

general {
    hide_cursor = true
}

background {
    monitor           =
    path              = ~/.config/hypr/settings/wallpaper
    color             = rgba(1c1c1eff)
    blur_passes       = 3
    blur_size         = 8
    brightness        = 0.72
    vibrancy          = 0.2
}

# date, then the time
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_size   = 20
    font_family = Inter SemiBold
    color       = rgba(f5f5f7d9)
    position    = 0, -150
    halign      = center
    valign      = top
}

label {
    monitor     =
    text        = $TIME
    font_size   = 104
    font_family = Inter Display SemiBold
    color       = rgba(f5f5f7f2)
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(00000040)
    position    = 0, -180
    halign      = center
    valign      = top
}

label {
    monitor     =
    text        = $DESC
    font_size   = 13
    font_family = Inter SemiBold
    color       = rgba(f5f5f7e6)
    position    = 0, 150
    halign      = center
    valign      = bottom
}

input-field {
    monitor           =
    size              = 240, 38
    outline_thickness = 1
    rounding          = -1
    outer_color       = rgba(ffffff1f)
    inner_color       = rgba(ffffff1a)
    font_color        = rgb(f5f5f7)
    font_family       = Inter
    check_color       = $accent
    fail_color        = rgb(ff453a)
    placeholder_text  = <span foreground="##f5f5f799">Enter Password</span>
    fail_text         = <span foreground="##ff453a">Wrong password</span>
    fade_on_empty     = false
    dots_size         = 0.22
    dots_spacing      = 0.35
    dots_center       = true
    position          = 0, 96
    halign            = center
    valign            = bottom
}
