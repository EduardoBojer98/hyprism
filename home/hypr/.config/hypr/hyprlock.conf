# Lock screen: blurred wallpaper, clock, date, password field. Catppuccin Macchiato.
# $accent and $rounding come from Settings > Appearance (Quickshell ThemeSync).
$accent = rgb(8aadf4)
$rounding = 16
source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
}

background {
    monitor     =
    path        = ~/Pictures/Wallpapers/glass-night.png
    color       = rgba(24273aff)
    blur_passes = 3
    blur_size   = 6
}

label {
    monitor     =
    text        = $TIME
    font_size   = 96
    font_family = Inter Display
    color       = rgb(cad3f5)
    position    = 0, 160
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_size   = 18
    font_family = Inter
    color       = rgb(a5adcb)
    position    = 0, 70
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 320, 52
    outline_thickness = 2
    rounding          = $rounding
    outer_color       = rgba(ffffff26)
    inner_color       = rgba(ffffff14)
    font_color        = rgb(cad3f5)
    font_family       = Inter
    check_color       = $accent
    fail_color        = rgb(ed8796)
    placeholder_text  = Password
    fail_text         = Wrong password
    fade_on_empty     = false
    dots_spacing      = 0.3
    position          = 0, -60
    halign            = center
    valign            = center
}
