# Minimal Catppuccin Macchiato lock screen; restyled in the rice phase.
general {
    hide_cursor = true
}

background {
    monitor =
    color   = rgba(24273aff)
}

label {
    monitor     =
    text        = $TIME
    font_size   = 72
    font_family = Inter
    color       = rgb(cad3f5)
    position    = 0, 90
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 300, 50
    outline_thickness = 2
    rounding          = 12
    outer_color       = rgb(8aadf4)
    inner_color       = rgb(363a4f)
    font_color        = rgb(cad3f5)
    check_color       = rgb(a6da95)
    fail_color        = rgb(ed8796)
    placeholder_text  = Password
    fade_on_empty     = false
    position          = 0, -40
    halign            = center
    valign            = center
}
