# ROG Flow X13 (GV301QC): the built-in microphone is the "Internal Microphone" input of the Realtek
# ALC294 codec, not the AMD ACP digital-mic path. WirePlumber had this card on an output-only profile,
# so no microphone existed. Start it on the duplex profile instead (speakers + internal mic).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_08_00.6" } ]
    actions = {
      update-props = {
        device.profile = "output:analog-stereo+input:analog-stereo"
      }
    }
  }
]
